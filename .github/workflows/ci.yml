name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    name: linux-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    # The integration tests (DBV_TEST_URL) run here against a throwaway
    # PostgreSQL; service containers exist on Linux runners only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBV_TEST_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Test
        timeout-minutes: 5
        run: go test -count=1 -timeout 120s ./...
      # A broken service would make the integration tests skip in silence.
      - name: Integration tests ran
        run: |
          go test -count=1 -timeout 120s -v . | tee out.txt
          if grep -q 'DBV_TEST_URL not set' out.txt; then echo "integration tests skipped: is the postgres service up?"; exit 1; fi

  macos:
    name: test-macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # No database here: the integration tests skip, the rest run.
      - name: Test
        timeout-minutes: 5
        run: go test -count=1 -timeout 120s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod tidy
        run: |
          go mod tidy -diff || { echo "go.mod/go.sum not tidy: run go mod tidy"; exit 1; }
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint (every GOOS)
        run: |
          for os in darwin linux freebsd; do
            echo "== GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
          done
